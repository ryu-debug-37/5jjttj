<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I Love You Sayang</title>

  <!-- Import Google Fonts: Font Latin (Alex Brush) & Font Monospace (VT323) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=VT323&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05010a;
      font-family: sans-serif;
    }

    /* Canvas Fullscreen */
    #matrixCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Overlay Teks dan Hati */
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    /* Teks Hitungan Mundur & Kata */
    .word-text {
      font-family: 'VT323', monospace;
      font-size: 5rem;
      color: #ffffff;
      text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff1493, 0 0 30px #ff1493;
      opacity: 0;
      transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
      transform: scale(0.8);
      position: absolute;
    }

    .word-text.active {
      opacity: 1;
      transform: scale(1);
    }

    /* Container Hati */
    .heart-container {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 1s ease, transform 1s ease;
    }

    .heart-container.active {
      opacity: 1;
      transform: scale(1);
    }

    /* Teks di Dalam Hati Menggunakan Font Latin (Alex Brush) */
    .heart-text {
      font-family: 'Alex Brush', cursive;
      font-size: 2.8rem;
      color: #ffffff;
      text-shadow: 0 0 8px #ff69b4, 0 0 15px #ff1493;
      text-align: center;
      z-index: 3;
      white-space: nowrap;
    }

    .heart-symbol {
      color: #ff2a75;
      display: inline-block;
      margin: 0 4px;
    }

    /* Partikel Pembentuk Hati */
    .heart-particle {
      position: absolute;
      width: 8px;
      height: 8px;
      background-color: #ff69b4;
      border-radius: 50%;
      box-shadow: 0 0 8px #ff1493, 0 0 12px #ff69b4;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
    }
  </style>
</head>
<body>

  <canvas id="matrixCanvas"></canvas>

  <div id="overlay">
    <div id="displayText" class="word-text"></div>
    
    <div id="heartBox" class="heart-container">
      <div class="heart-text">
        I Love <span class="heart-symbol">♥</span> You Sayang
      </div>
    </div>
  </div>

  <script>
    // --- 1. SCRIPT EFEK MATRIX PINK ---
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ♥♡';
    const fontSize = 16;
    let columns = Math.floor(canvas.width / fontSize);
    let drops = Array(columns).fill(1);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(5, 1, 10, 0.15)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#ff3385';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    setInterval(drawMatrix, 33);

    // --- 2. GENERATE PARTIKEL BENTUK HATI ---
    const heartBox = document.getElementById('heartBox');
    const totalParticles = 70;

    for (let i = 0; i < totalParticles; i++) {
      const t = (Math.PI * 2 / totalParticles) * i;
      // Formula Matematika Bentuk Hati (Heart Curve)
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

      const particle = document.createElement('div');
      particle.className = 'heart-particle';
      
      // Skala posisi
      const scale = 8;
      particle.style.left = `calc(50% + ${x * scale}px)`;
      particle.style.top = `calc(50% + ${y * scale}px)`;
      particle.style.animationDelay = `${(i % 10) * 0.1}s`;

      heartBox.appendChild(particle);
    }

    // --- 3. ANIMASI TEKS SEKUENSIAL ---
    const sequence = ['3', '2', '1', 'You', 'Are', 'My', 'Love'];
    const displayText = document.getElementById('displayText');
    let index = 0;

    function playSequence() {
      if (index < sequence.length) {
        displayText.textContent = sequence[index];
        displayText.classList.add('active');

        setTimeout(() => {
          displayText.classList.remove('active');
          index++;
          setTimeout(playSequence, 300);
        }, 800);
      } else {
        // Tampilkan animasi Hati di akhir
        setTimeout(() => {
          heartBox.classList.add('active');
        }, 200);
      }
    }

    // Mulai animasi
    setTimeout(playSequence, 1000);
  </script>
</body>
</html>
